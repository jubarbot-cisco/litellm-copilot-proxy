general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # forward_client_headers_to_llm_api: True
litellm_settings:
  default_max_tokens: 8096
  # set_verbose: true
  modify_params: True
  telemetry: False
  drop_params: True # Needed for claude code over github copilot
  turn_off_message_logging: True
  disable_end_user_cost_tracking: True
  enable_json_schema_validation: True
  json_logs: True
  request_timeout: 300

router_settings:
  model_group_alias: {}
  num_retries: 2
  retry_policy:
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0

  # Fallback example, intentionally inactive. Enabling a fallback sends the
  # prompt to another model. Keep fallbacks within one provider unless both
  # providers have equivalent data-handling terms.
  # fallbacks:
  #   - cisco-claude-opus-5: [cisco-claude-opus-4-8]
  #   - cisco-claude-sonnet-4-6: [cisco-claude-sonnet-5]
  #   - copilot-gpt-5.6-sol: [copilot-gpt-5.6-terra]

model_list: []

# Complexity router, configured with valid aliases but intentionally inactive.
# Uncomment this block to expose smart-router, then run `make check`.
# model_list:
