#           MEDIUM: cisco-gpt-5-mini
#           COMPLEX: cisco-claude-sonnet-4-6
#           REASONING: cisco-claude-opus-4-8
#       complexity_router_default_model: cisco-gpt-4o-mini

include:
  - model_config.yaml
  - cisco_models_config.yaml
  - things_models_config.yaml
